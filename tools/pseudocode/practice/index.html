<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>伪代码练习场 · 9618 Paper 2 · iben.fun</title>
<meta name="description" content="按难度分类的 9618 Paper 2 伪代码真题练习,写完直接判分。">
<link rel="stylesheet" href="practice.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="../">iben.fun<span class="crumb"> / 器 / 伪代码练习场</span></a>
  <span class="count" id="count"></span>
  <span class="count" id="progress"></span>
  <span class="spacer"></span>
  <select id="difficulty" aria-label="按难度筛选">
    <option value="0">全部难度</option>
    <option value="1">★ 基础</option>
    <option value="2">★★ 进阶</option>
    <option value="3">★★★ 综合</option>
  </select>
  <button id="wrong" title="只显示做错的题">错题本</button>
  <button id="theme" title="切换明暗">◑</button>
  <a class="back" href="../">编辑器 →</a>
</header>

<main class="split">
  <aside class="list-pane">
    <ul id="task-list"></ul>
    <p id="list-note" class="list-note" hidden></p>
  </aside>

  <section class="work-pane">
    <div id="empty" class="empty">
      <h1>选择左侧的一道题开始</h1>
      <p>题目来自 9618 Paper 2 真题,以及按考纲编写的原创题;写完点「检查」直接判分。</p>
    </div>

    <div id="task" class="task" hidden>
      <div class="task-card">
        <div class="task-head">
          <h2 id="task-title"></h2>
          <span id="task-meta" class="task-meta"></span>
        </div>
        <p id="task-requirement" class="requirement"></p>
        <div id="task-prompt" class="prompt"></div>
        <div id="task-files" class="task-files" hidden></div>
      </div>

      <div class="work-row">
        <div id="editor"></div>
        <pre id="task-answer" class="answer" hidden></pre>
      </div>

      <div class="actions">
        <button id="check" class="primary">检查</button>
        <button id="clear">清空</button>
        <span id="verdict" class="verdict"></span>
        <button id="show-answer" hidden>查看参考答案</button>
      </div>

      <ul id="cases" class="cases"></ul>
    </div>
  </section>
</main>

<script src="../vendor/monaco/vs/loader.js"></script>
<script type="module" src="practice.js"></script>
</body>
</html>
