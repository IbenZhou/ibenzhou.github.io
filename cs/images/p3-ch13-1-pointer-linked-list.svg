<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#5a6b6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="300" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f3d3e">A linked list built with pointers</text>
  <text x="450" y="56" text-anchor="middle" font-size="14" fill="#5a6b6b">Each node holds data and a pointer to the next node</text>

  <!-- StartPtr -->
  <rect x="40" y="130" width="96" height="50" rx="8" fill="#fbf0d8" stroke="#d9a441" stroke-width="1.5"/>
  <text x="88" y="151" text-anchor="middle" font-size="12.5" font-weight="700" fill="#854f0b">StartPtr</text>
  <text x="88" y="169" text-anchor="middle" font-size="11.5" fill="#854f0b">holds address</text>

  <line x1="140" y1="155" x2="188" y2="155" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- nodes -->
  <g>
    <rect x="192" y="110" width="150" height="90" rx="10" fill="#eef7f5" stroke="#1d9e75" stroke-width="1.5"/>
    <line x1="192" y1="158" x2="342" y2="158" stroke="#1d9e75" stroke-width="0.8"/>
    <text x="267" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#0f6e56">Node 1</text>
    <text x="267" y="180" text-anchor="middle" font-size="12.5" fill="#233b3a">Data: 10</text>
    <text x="267" y="196" text-anchor="middle" font-size="12" fill="#0f6e56">Next: ^Node</text>
  </g>
  <line x1="346" y1="176" x2="398" y2="176" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <g>
    <rect x="402" y="110" width="150" height="90" rx="10" fill="#eef7f5" stroke="#1d9e75" stroke-width="1.5"/>
    <line x1="402" y1="158" x2="552" y2="158" stroke="#1d9e75" stroke-width="0.8"/>
    <text x="477" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#0f6e56">Node 2</text>
    <text x="477" y="180" text-anchor="middle" font-size="12.5" fill="#233b3a">Data: 20</text>
    <text x="477" y="196" text-anchor="middle" font-size="12" fill="#0f6e56">Next: ^Node</text>
  </g>
  <line x1="556" y1="176" x2="608" y2="176" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <g>
    <rect x="612" y="110" width="150" height="90" rx="10" fill="#eef7f5" stroke="#1d9e75" stroke-width="1.5"/>
    <line x1="612" y1="158" x2="762" y2="158" stroke="#1d9e75" stroke-width="0.8"/>
    <text x="687" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#0f6e56">Node 3</text>
    <text x="687" y="180" text-anchor="middle" font-size="12.5" fill="#233b3a">Data: 30</text>
    <text x="687" y="196" text-anchor="middle" font-size="12" fill="#0f6e56">Next: NULL</text>
  </g>

  <text x="780" y="182" font-size="12" fill="#993c1d">NULL = end</text>

  <text x="40" y="248" font-size="13" fill="#233b3a">Traversal: follow StartPtr, read Data, then follow each Next pointer until NULL</text>
  <text x="40" y="274" font-size="13" fill="#233b3a">Allocation: NEW(NodePtr) reserves memory at run time; the pointer stores that address</text>
</svg>
