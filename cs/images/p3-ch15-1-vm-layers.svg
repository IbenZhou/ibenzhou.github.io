<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="760" height="460" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f3d3e">Virtual machine layers</text>
  <text x="380" y="56" text-anchor="middle" font-size="14" fill="#5a6b6b">A hypervisor lets multiple guest OSes share one physical machine</text>

  <!-- Guest OSes -->
  <rect x="60" y="86" width="290" height="80" rx="10" fill="#f4effb" stroke="#7f77dd" stroke-width="1.5"/>
  <text x="205" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#534ab7">Guest OS 1 + apps</text>
  <text x="205" y="140" text-anchor="middle" font-size="12" fill="#534ab7">isolated virtual machine</text>

  <rect x="410" y="86" width="290" height="80" rx="10" fill="#f4effb" stroke="#7f77dd" stroke-width="1.5"/>
  <text x="555" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#534ab7">Guest OS 2 + apps</text>
  <text x="555" y="140" text-anchor="middle" font-size="12" fill="#534ab7">isolated virtual machine</text>

  <!-- arrows down -->
  <line x1="205" y1="168" x2="205" y2="196" stroke="#5a6b6b" stroke-width="1.5"/>
  <line x1="555" y1="168" x2="555" y2="196" stroke="#5a6b6b" stroke-width="1.5"/>

  <!-- Hypervisor / VMM -->
  <rect x="60" y="200" width="640" height="72" rx="10" fill="#eef7f5" stroke="#1d9e75" stroke-width="2"/>
  <text x="380" y="230" text-anchor="middle" font-size="16" font-weight="700" fill="#0f6e56">Hypervisor (Virtual Machine Monitor)</text>
  <text x="380" y="254" text-anchor="middle" font-size="12" fill="#0f6e56">allocates real resources · enforces isolation · traps privileged operations</text>

  <line x1="380" y1="274" x2="380" y2="302" stroke="#5a6b6b" stroke-width="1.5"/>

  <!-- Host OS -->
  <rect x="60" y="306" width="640" height="64" rx="10" fill="#eef3fb" stroke="#378add" stroke-width="1.5"/>
  <text x="380" y="334" text-anchor="middle" font-size="15" font-weight="700" fill="#185fa5">Host OS (type 2 hypervisor)</text>
  <text x="380" y="356" text-anchor="middle" font-size="12" fill="#185fa5">may be absent in a type 1 / bare-metal hypervisor</text>

  <line x1="380" y1="372" x2="380" y2="396" stroke="#5a6b6b" stroke-width="1.5"/>

  <!-- Hardware -->
  <rect x="60" y="400" width="640" height="48" rx="10" fill="#f1efe8" stroke="#888780" stroke-width="1.5"/>
  <text x="380" y="429" text-anchor="middle" font-size="15" font-weight="700" fill="#2c2c2a">Physical hardware: CPU · memory · disk · network</text>
</svg>
