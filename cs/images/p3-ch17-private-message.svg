<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#5a6b6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="320" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f3d3e">Sending a private message</text>
  <text x="450" y="56" text-anchor="middle" font-size="14" fill="#5a6b6b">Encrypt with the receiver's public key — only the receiver can read it</text>

  <g font-size="12.5" fill="#042c53">
    <rect x="36" y="104" width="150" height="52" rx="8" fill="#eef7f5" stroke="#1d9e75"/>
    <text x="111" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#0f6e56">Sender</text>
    <text x="111" y="144" text-anchor="middle" font-size="11.5" fill="#0f6e56">has receiver's public key</text>

    <line x1="190" y1="130" x2="242" y2="130" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="246" y="104" width="170" height="52" rx="8" fill="#e3f2ed" stroke="#1d9e75"/>
    <text x="331" y="126" text-anchor="middle" font-size="12" fill="#0f6e56">Encrypt plaintext with</text>
    <text x="331" y="144" text-anchor="middle" font-size="12" fill="#0f6e56">receiver's PUBLIC key</text>

    <line x1="420" y1="130" x2="472" y2="130" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="476" y="104" width="120" height="52" rx="8" fill="#f4effb" stroke="#7f77dd"/>
    <text x="536" y="126" text-anchor="middle" font-size="12" fill="#534ab7">Ciphertext</text>
    <text x="536" y="144" text-anchor="middle" font-size="11.5" fill="#534ab7">sent openly</text>

    <line x1="600" y1="130" x2="652" y2="130" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="656" y="104" width="208" height="52" rx="8" fill="#eef7f5" stroke="#1d9e75"/>
    <text x="760" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#0f6e56">Receiver</text>
    <text x="760" y="144" text-anchor="middle" font-size="11.5" fill="#0f6e56">decrypts with PRIVATE key</text>
  </g>

  <text x="450" y="204" text-anchor="middle" font-size="13" fill="#233b3a">The private key is never transmitted — only the receiver holds it</text>
  <rect x="210" y="228" width="480" height="52" rx="8" fill="#fbf0d8" stroke="#d9a441" stroke-width="1"/>
  <text x="450" y="250" text-anchor="middle" font-size="12.5" fill="#854f0b">Contrast: a verified (signed) message uses the SENDER's private key to encrypt,</text>
  <text x="450" y="268" text-anchor="middle" font-size="12.5" fill="#854f0b">so anyone with the sender's public key can verify its origin</text>
</svg>
