<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#5a6b6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="860" height="300" fill="#ffffff"/>
  <text x="430" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#0f3d3e">Full adder</text>
  <text x="430" y="54" text-anchor="middle" font-size="14" fill="#5a6b6b">Built from two half adders and an OR gate — adds three bits</text>

  <!-- inputs -->
  <text x="34" y="100" font-size="13" font-weight="700" fill="#233b3a">A</text>
  <text x="34" y="130" font-size="13" font-weight="700" fill="#233b3a">B</text>
  <text x="34" y="244" font-size="13" font-weight="700" fill="#233b3a">C_in</text>
  <line x1="52" y1="96" x2="130" y2="96" stroke="#5a6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="52" y1="126" x2="130" y2="126" stroke="#5a6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="70" y1="240" x2="130" y2="240" stroke="#5a6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- HA1 -->
  <rect x="134" y="74" width="130" height="76" rx="9" fill="#eef7f5" stroke="#1d9e75" stroke-width="1.5"/>
  <text x="199" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#0f6e56">Half adder 1</text>
  <text x="199" y="126" text-anchor="middle" font-size="11.5" fill="#0f6e56">A + B</text>

  <!-- HA2 -->
  <rect x="360" y="150" width="130" height="76" rx="9" fill="#eef7f5" stroke="#1d9e75" stroke-width="1.5"/>
  <text x="425" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#0f6e56">Half adder 2</text>
  <text x="425" y="202" text-anchor="middle" font-size="11.5" fill="#0f6e56">S1 + C_in</text>

  <!-- OR -->
  <g stroke="#378add" stroke-width="1.8" fill="#eef3fb">
    <path d="M560 200 Q 610 200 640 240 Q 610 280 560 280 Q 585 240 560 200 Z"/>
  </g>
  <text x="612" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#185fa5">≥1</text>

  <!-- wires HA1 out -->
  <line x1="264" y1="100" x2="330" y2="100" stroke="#1d9e75" stroke-width="1.5"/>
  <line x1="330" y1="100" x2="330" y2="176" stroke="#1d9e75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="264" y1="124" x2="330" y2="124" stroke="#378add" stroke-width="1.5"/>
  <line x1="330" y1="124" x2="330" y2="220" stroke="#378add" stroke-width="1.5"/>
  <line x1="130" y1="240" x2="360" y2="240" stroke="#5a6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="176" x2="700" y2="176" stroke="#1d9e75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="706" y="181" font-size="13" font-weight="700" fill="#0f6e56">Sum</text>
  <line x1="490" y1="198" x2="560" y2="198" stroke="#378add" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="220" x2="560" y2="220" stroke="#378add" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="240" x2="700" y2="240" stroke="#378add" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="706" y="245" font-size="13" font-weight="700" fill="#185fa5">C_out</text>

  <text x="430" y="292" text-anchor="middle" font-size="12" fill="#5a6b6b">First half adder adds A and B; second adds its sum with C_in; OR combines the two carries</text>
</svg>
