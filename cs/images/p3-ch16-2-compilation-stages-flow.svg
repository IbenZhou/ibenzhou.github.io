<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#5a6b6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="350" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f3d3e">Stages of compilation</text>
  <text x="480" y="56" text-anchor="middle" font-size="14" fill="#5a6b6b">Source code is transformed step by step into executable object code</text>

  <g font-size="12.5" fill="#0f3d3e">
    <rect x="24" y="122" width="118" height="56" rx="8" fill="#eef7f5" stroke="#1d9e75"/>
    <text x="83" y="145" text-anchor="middle" font-size="12" fill="#0f6e56">1</text>
    <text x="83" y="165" text-anchor="middle">Lexical</text>

    <line x1="144" y1="150" x2="172" y2="150" stroke="#5a6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="176" y="122" width="118" height="56" rx="8" fill="#eef7f5" stroke="#1d9e75"/>
    <text x="235" y="145" text-anchor="middle" font-size="12" fill="#0f6e56">2</text>
    <text x="235" y="165" text-anchor="middle">Syntax</text>

    <line x1="296" y1="150" x2="324" y2="150" stroke="#5a6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="328" y="122" width="118" height="56" rx="8" fill="#eef7f5" stroke="#1d9e75"/>
    <text x="387" y="145" text-anchor="middle" font-size="12" fill="#0f6e56">3</text>
    <text x="387" y="165" text-anchor="middle">Semantic</text>

    <line x1="448" y1="150" x2="476" y2="150" stroke="#5a6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="480" y="122" width="118" height="56" rx="8" fill="#eef3fb" stroke="#378add"/>
    <text x="539" y="145" text-anchor="middle" font-size="12" fill="#185fa5">4</text>
    <text x="539" y="165" text-anchor="middle">Intermediate</text>

    <line x1="600" y1="150" x2="628" y2="150" stroke="#5a6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="632" y="122" width="118" height="56" rx="8" fill="#eef3fb" stroke="#378add"/>
    <text x="691" y="145" text-anchor="middle" font-size="12" fill="#185fa5">5</text>
    <text x="691" y="165" text-anchor="middle">Optimise</text>

    <line x1="752" y1="150" x2="780" y2="150" stroke="#5a6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="784" y="122" width="152" height="56" rx="8" fill="#eef3fb" stroke="#378add"/>
    <text x="860" y="145" text-anchor="middle" font-size="12" fill="#185fa5">6</text>
    <text x="860" y="165" text-anchor="middle">Code generation</text>
  </g>

  <line x1="83" y1="184" x2="83" y2="222" stroke="#1d9e75" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="235" y1="184" x2="235" y2="222" stroke="#1d9e75" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="387" y1="184" x2="387" y2="222" stroke="#1d9e75" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="539" y1="184" x2="539" y2="222" stroke="#378add" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="691" y1="184" x2="691" y2="222" stroke="#378add" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="860" y1="184" x2="860" y2="222" stroke="#378add" stroke-width="1" stroke-dasharray="3 3"/>

  <g font-size="11.5" fill="#5a6b6b" text-anchor="middle">
    <text x="83" y="240">tokens</text>
    <text x="83" y="256">remove comments</text>
    <text x="235" y="240">parse tree</text>
    <text x="235" y="256">check grammar</text>
    <text x="387" y="240">checked tree</text>
    <text x="387" y="256">check meaning</text>
    <text x="539" y="240">machine-independent</text>
    <text x="691" y="240">faster / smaller</text>
    <text x="860" y="240">object code</text>
  </g>

  <rect x="300" y="288" width="360" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.8"/>
  <text x="480" y="315" text-anchor="middle" font-size="12.5" fill="#2c2c2a">Errors may be found at stages 1–3; later stages produce the running program</text>
</svg>
