<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f3d3e">Evaluating Reverse Polish Notation with a stack</text>
  <text x="450" y="56" text-anchor="middle" font-size="14" fill="#5a6b6b">Example: 3 4 + 2 × = 14</text>

  <!-- step 1 -->
  <g>
    <rect x="30" y="88" width="180" height="290" rx="12" fill="#eef7f5" stroke="#1d9e75" stroke-width="1.5"/>
    <text x="120" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#0f6e56">Push 3, push 4</text>
    <rect x="60" y="252" width="120" height="40" rx="6" fill="#d5efe6" stroke="#1d9e75"/>
    <text x="120" y="277" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3d3e">4</text>
    <rect x="60" y="300" width="120" height="40" rx="6" fill="#d5efe6" stroke="#1d9e75"/>
    <text x="120" y="325" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3d3e">3</text>
    <text x="120" y="366" text-anchor="middle" font-size="11.5" fill="#5a6b6b">top of stack</text>
  </g>

  <!-- step 2 -->
  <g>
    <rect x="240" y="88" width="180" height="290" rx="12" fill="#eef3fb" stroke="#378add" stroke-width="1.5"/>
    <text x="330" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#185fa5">On '+': pop 4, 3</text>
    <rect x="270" y="300" width="120" height="40" rx="6" fill="#faece7" stroke="#d85a30" stroke-dasharray="4 3"/>
    <text x="330" y="325" text-anchor="middle" font-size="13" fill="#993c1d">pop 4, 3</text>
    <text x="330" y="246" text-anchor="middle" font-size="12" fill="#233b3a">3 + 4 = 7</text>
  </g>

  <!-- step 3 -->
  <g>
    <rect x="450" y="88" width="180" height="290" rx="12" fill="#eef7f5" stroke="#1d9e75" stroke-width="1.5"/>
    <text x="540" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#0f6e56">Push result 7, push 2</text>
    <rect x="480" y="252" width="120" height="40" rx="6" fill="#d5efe6" stroke="#1d9e75"/>
    <text x="540" y="277" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3d3e">2</text>
    <rect x="480" y="300" width="120" height="40" rx="6" fill="#d5efe6" stroke="#1d9e75"/>
    <text x="540" y="325" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3d3e">7</text>
  </g>

  <!-- step 4 -->
  <g>
    <rect x="660" y="88" width="210" height="290" rx="12" fill="#f4effb" stroke="#7f77dd" stroke-width="1.5"/>
    <text x="765" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#534ab7">On '×': pop 2, 7</text>
    <rect x="690" y="300" width="150" height="48" rx="8" fill="#e6e2fa" stroke="#7f77dd" stroke-width="2"/>
    <text x="765" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#26215c">14</text>
    <text x="765" y="366" text-anchor="middle" font-size="12" fill="#534ab7">final answer</text>
  </g>

  <g font-size="14" fill="#5a6b6b">
    <text x="212" y="230" text-anchor="middle">→</text>
    <text x="422" y="230" text-anchor="middle">→</text>
    <text x="633" y="230" text-anchor="middle">→</text>
  </g>
  <text x="450" y="404" text-anchor="middle" font-size="12.5" fill="#5a6b6b">Rule: push operands; when an operator appears, pop the top two, apply it, and push the result.</text>
</svg>
