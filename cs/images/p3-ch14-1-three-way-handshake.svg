<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#5a6b6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f3d3e">TCP three-way handshake</text>
  <text x="450" y="56" text-anchor="middle" font-size="14" fill="#5a6b6b">Establishing a reliable connection before data transfer</text>

  <!-- lifelines -->
  <rect x="130" y="90" width="130" height="46" rx="8" fill="#eef7f5" stroke="#1d9e75" stroke-width="1.5"/>
  <text x="195" y="119" text-anchor="middle" font-size="15" font-weight="700" fill="#0f6e56">Client</text>
  <rect x="640" y="90" width="130" height="46" rx="8" fill="#eef3fb" stroke="#378add" stroke-width="1.5"/>
  <text x="705" y="119" text-anchor="middle" font-size="15" font-weight="700" fill="#185fa5">Server</text>
  <line x1="195" y1="136" x2="195" y2="360" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="705" y1="136" x2="705" y2="360" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- step 1 -->
  <line x1="195" y1="172" x2="700" y2="172" stroke="#1d9e75" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="148" width="290" height="22" rx="5" fill="#ffffff"/>
  <text x="445" y="164" text-anchor="middle" font-size="13" fill="#0f6e56">1. SYN — request to open connection</text>

  <!-- step 2 -->
  <line x1="705" y1="232" x2="200" y2="232" stroke="#378add" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="208" width="310" height="22" rx="5" fill="#ffffff"/>
  <text x="455" y="224" text-anchor="middle" font-size="13" fill="#185fa5">2. SYN-ACK — acknowledge + agree</text>

  <!-- step 3 -->
  <line x1="195" y1="292" x2="700" y2="292" stroke="#7f77dd" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="268" width="300" height="22" rx="5" fill="#ffffff"/>
  <text x="450" y="284" text-anchor="middle" font-size="13" fill="#534ab7">3. ACK — confirm; connection established</text>

  <text x="450" y="360" text-anchor="middle" font-size="13" fill="#5a6b6b">Only after all three messages is data transferred</text>
</svg>
