<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#5a6b6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="860" height="340" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f3d3e">State-space search</text>
  <text x="430" y="56" text-anchor="middle" font-size="14" fill="#5a6b6b">Nodes are problem states; edges are actions with a cost</text>

  <!-- Start -->
  <circle cx="100" cy="180" r="26" fill="#eef7f5" stroke="#1d9e75" stroke-width="2"/>
  <text x="100" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#0f6e56">Start</text>
  <!-- middle nodes -->
  <circle cx="300" cy="110" r="24" fill="#eef3fb" stroke="#378add" stroke-width="2"/>
  <text x="300" y="115" text-anchor="middle" font-size="12" fill="#185fa5">A</text>
  <circle cx="300" cy="250" r="24" fill="#eef3fb" stroke="#378add" stroke-width="2"/>
  <text x="300" y="255" text-anchor="middle" font-size="12" fill="#185fa5">B</text>
  <circle cx="540" cy="110" r="24" fill="#eef3fb" stroke="#378add" stroke-width="2"/>
  <text x="540" y="115" text-anchor="middle" font-size="12" fill="#185fa5">C</text>
  <circle cx="540" cy="250" r="24" fill="#eef3fb" stroke="#378add" stroke-width="2"/>
  <text x="540" y="255" text-anchor="middle" font-size="12" fill="#185fa5">D</text>
  <!-- Goal -->
  <circle cx="740" cy="180" r="28" fill="#f4effb" stroke="#7f77dd" stroke-width="2.5"/>
  <text x="740" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#534ab7">Goal</text>

  <!-- edges with costs -->
  <line x1="126" y1="170" x2="278" y2="118" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="185" y="132" font-size="11" fill="#5a6b6b">action, cost 2</text>
  <line x1="126" y1="190" x2="278" y2="242" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="180" y="232" font-size="11" fill="#5a6b6b">action, cost 4</text>
  <line x1="324" y1="110" x2="514" y2="110" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="419" y="103" text-anchor="middle" font-size="11" fill="#5a6b6b">cost 1</text>
  <line x1="324" y1="250" x2="514" y2="250" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="419" y="243" text-anchor="middle" font-size="11" fill="#5a6b6b">cost 3</text>
  <line x1="562" y1="122" x2="716" y2="170" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="640" y="134" font-size="11" fill="#5a6b6b">cost 5</text>
  <line x1="562" y1="238" x2="716" y2="190" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="640" y="228" font-size="11" fill="#5a6b6b">cost 2</text>

  <text x="430" y="312" text-anchor="middle" font-size="12.5" fill="#233b3a">Search algorithms explore states and choose paths by total cost to reach the goal</text>
</svg>
