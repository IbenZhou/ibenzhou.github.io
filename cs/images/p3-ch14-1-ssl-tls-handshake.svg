<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#5a6b6b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f3d3e">SSL/TLS handshake</text>
  <text x="450" y="56" text-anchor="middle" font-size="14" fill="#5a6b6b">Establish identity and agree session keys before secure data transfer</text>

  <!-- Client / Server headers -->
  <rect x="90" y="84" width="150" height="40" rx="8" fill="#e6f0fb" stroke="#378add" stroke-width="1.5"/>
  <text x="165" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#185fa5">Client (browser)</text>
  <rect x="660" y="84" width="150" height="40" rx="8" fill="#eef7f5" stroke="#1d9e75" stroke-width="1.5"/>
  <text x="735" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#0f6e56">Server (website)</text>

  <!-- step 1 -->
  <line x1="240" y1="150" x2="660" y2="150" stroke="#378add" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="450" y="143" text-anchor="middle" font-size="12.5" fill="#185fa5">1. ClientHello: supported algorithms + random number</text>

  <!-- step 2 -->
  <line x1="660" y1="200" x2="240" y2="200" stroke="#1d9e75" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="450" y="193" text-anchor="middle" font-size="12.5" fill="#0f6e56">2. ServerHello + digital certificate (contains server's public key)</text>

  <!-- step 3 -->
  <rect x="300" y="224" width="300" height="40" rx="8" fill="#fbf0d8" stroke="#d9a441" stroke-width="1.2"/>
  <text x="450" y="249" text-anchor="middle" font-size="12.5" fill="#854f0b">3. Client verifies certificate with CA's public key</text>

  <!-- step 4 -->
  <line x1="240" y1="292" x2="660" y2="292" stroke="#378add" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="450" y="285" text-anchor="middle" font-size="12.5" fill="#185fa5">4. Client sends session key encrypted with server's public key</text>

  <!-- step 5 -->
  <rect x="230" y="316" width="440" height="40" rx="8" fill="#eef7f5" stroke="#1d9e75" stroke-width="1.2"/>
  <text x="450" y="341" text-anchor="middle" font-size="12.5" fill="#0f6e56">5. Both derive session keys, then switch to fast symmetric encryption</text>

  <text x="90" y="386" font-size="12.5" fill="#5a6b6b">TLS sits between the application layer and TCP; HTTPS = HTTP over TLS.</text>
</svg>
