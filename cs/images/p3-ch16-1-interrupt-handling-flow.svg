<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#5a6b6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f3d3e">Interrupt handling by the kernel</text>
  <text x="450" y="56" text-anchor="middle" font-size="14" fill="#5a6b6b">The OS responds to an event, then resumes the interrupted process</text>

  <g font-size="12.5" fill="#0f3d3e">
    <rect x="40" y="92" width="150" height="54" rx="9" fill="#faece7" stroke="#d85a30"/>
    <text x="115" y="115" text-anchor="middle" font-size="12" fill="#993c1d">1. Signal arrives</text>
    <text x="115" y="134" text-anchor="middle">interrupt received</text>

    <line x1="194" y1="119" x2="244" y2="119" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="248" y="92" width="160" height="54" rx="9" fill="#eef7f5" stroke="#1d9e75"/>
    <text x="328" y="115" text-anchor="middle" font-size="12" fill="#0f6e56">2. Check priority</text>
    <text x="328" y="134" text-anchor="middle">vs current process</text>

    <line x1="412" y1="119" x2="462" y2="119" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="466" y="92" width="160" height="54" rx="9" fill="#eef7f5" stroke="#1d9e75"/>
    <text x="546" y="115" text-anchor="middle" font-size="12" fill="#0f6e56">3. Switch to</text>
    <text x="546" y="134" text-anchor="middle">kernel mode</text>

    <line x1="630" y1="119" x2="680" y2="119" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="684" y="92" width="176" height="54" rx="9" fill="#eef7f5" stroke="#1d9e75"/>
    <text x="772" y="115" text-anchor="middle" font-size="12" fill="#0f6e56">4. Save registers</text>
    <text x="772" y="134" text-anchor="middle">onto the stack</text>
  </g>

  <!-- second row -->
  <g font-size="12.5" fill="#0f3d3e">
    <rect x="684" y="212" width="176" height="54" rx="9" fill="#eef3fb" stroke="#378add"/>
    <text x="772" y="235" text-anchor="middle" font-size="12" fill="#185fa5">5. Look up IDT</text>
    <text x="772" y="254" text-anchor="middle">find the ISR</text>

    <line x1="680" y1="239" x2="632" y2="239" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="466" y="212" width="160" height="54" rx="9" fill="#eef3fb" stroke="#378add"/>
    <text x="546" y="235" text-anchor="middle" font-size="12" fill="#185fa5">6. Run the ISR</text>
    <text x="546" y="254" text-anchor="middle">service the interrupt</text>

    <line x1="462" y1="239" x2="412" y2="239" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="248" y="212" width="160" height="54" rx="9" fill="#eef3fb" stroke="#378add"/>
    <text x="328" y="235" text-anchor="middle" font-size="12" fill="#185fa5">7. Restore registers</text>
    <text x="328" y="254" text-anchor="middle">from the stack</text>

    <line x1="244" y1="239" x2="194" y2="239" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="40" y="212" width="150" height="54" rx="9" fill="#eef7f5" stroke="#1d9e75"/>
    <text x="115" y="235" text-anchor="middle" font-size="12" fill="#0f6e56">8. Resume</text>
    <text x="115" y="254" text-anchor="middle">interrupted process</text>
  </g>

  <text x="450" y="310" text-anchor="middle" font-size="12.5" fill="#233b3a">IDT = interrupt descriptor table · ISR = interrupt service routine</text>
  <text x="450" y="338" text-anchor="middle" font-size="12.5" fill="#993c1d">Saving and restoring registers lets the process continue exactly where it stopped</text>
</svg>
