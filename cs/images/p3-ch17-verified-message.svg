<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#5a6b6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="340" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f3d3e">Sending a verified (signed) message</text>
  <text x="450" y="56" text-anchor="middle" font-size="14" fill="#5a6b6b">Encrypt with the sender's private key — anyone can verify who sent it</text>

  <g font-size="12.5" fill="#042c53">
    <rect x="36" y="96" width="150" height="52" rx="8" fill="#eef7f5" stroke="#1d9e75"/>
    <text x="111" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#0f6e56">Sender</text>
    <text x="111" y="136" text-anchor="middle" font-size="11.5" fill="#0f6e56">signs with own PRIVATE key</text>

    <line x1="190" y1="122" x2="242" y2="122" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="246" y="96" width="190" height="52" rx="8" fill="#e3f2ed" stroke="#1d9e75"/>
    <text x="341" y="118" text-anchor="middle" font-size="12" fill="#0f6e56">Encrypted / signed</text>
    <text x="341" y="136" text-anchor="middle" font-size="12" fill="#0f6e56">message sent</text>

    <line x1="440" y1="122" x2="492" y2="122" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="496" y="96" width="176" height="52" rx="8" fill="#eef3fb" stroke="#378add"/>
    <text x="584" y="118" text-anchor="middle" font-size="12" fill="#185fa5">Anyone decrypts with</text>
    <text x="584" y="136" text-anchor="middle" font-size="12" fill="#185fa5">sender's PUBLIC key</text>

    <line x1="676" y1="122" x2="728" y2="122" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="732" y="96" width="132" height="52" rx="8" fill="#e6f0fb" stroke="#378add"/>
    <text x="798" y="118" text-anchor="middle" font-size="12" fill="#185fa5">Origin verified</text>
    <text x="798" y="136" text-anchor="middle" font-size="11.5" fill="#185fa5">authenticity</text>
  </g>

  <rect x="36" y="184" width="828" height="112" rx="12" fill="#f4effb" stroke="#7f77dd" stroke-width="1.2"/>
  <text x="56" y="212" font-size="13.5" font-weight="700" fill="#534ab7">Why this proves identity</text>
  <text x="56" y="238" font-size="12.5" fill="#233b3a">Only the sender holds their own private key, so a message that decrypts correctly with</text>
  <text x="56" y="258" font-size="12.5" fill="#233b3a">the sender's public key must have been signed by that sender.</text>
  <text x="56" y="282" font-size="12.5" fill="#993c1d">Provides authentication and non-repudiation — the sender cannot deny sending it</text>
</svg>
