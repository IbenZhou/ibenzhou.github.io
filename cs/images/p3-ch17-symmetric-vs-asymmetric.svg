<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#5a6b6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f3d3e">Symmetric vs asymmetric encryption</text>

  <!-- Symmetric -->
  <rect x="24" y="64" width="852" height="164" rx="14" fill="#eef7f5" stroke="#1d9e75" stroke-width="1.5"/>
  <text x="44" y="94" font-size="16" font-weight="700" fill="#0f6e56">Symmetric — one shared secret key</text>
  <g font-size="12.5" fill="#0f3d3e">
    <rect x="48" y="122" width="120" height="40" rx="7" fill="#d5efe6" stroke="#1d9e75"/>
    <text x="108" y="147" text-anchor="middle">Plaintext</text>
    <line x1="172" y1="142" x2="222" y2="142" stroke="#5a6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="226" y="122" width="180" height="40" rx="7" fill="#e3f2ed" stroke="#1d9e75"/>
    <text x="316" y="147" text-anchor="middle">Encrypt with key K</text>
    <line x1="410" y1="142" x2="460" y2="142" stroke="#5a6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="464" y="122" width="120" height="40" rx="7" fill="#d5efe6" stroke="#1d9e75"/>
    <text x="524" y="147" text-anchor="middle">Ciphertext</text>
    <line x1="588" y1="142" x2="638" y2="142" stroke="#5a6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="642" y="122" width="180" height="40" rx="7" fill="#e3f2ed" stroke="#1d9e75"/>
    <text x="732" y="147" text-anchor="middle">Decrypt with key K</text>
  </g>
  <text x="48" y="196" font-size="12.5" fill="#233b3a">Same key encrypts and decrypts · fast · good for large data</text>
  <text x="48" y="216" font-size="12.5" fill="#993c1d">Problem: key distribution — both parties need the secret securely</text>

  <!-- Asymmetric -->
  <rect x="24" y="246" width="852" height="176" rx="14" fill="#eef3fb" stroke="#378add" stroke-width="1.5"/>
  <text x="44" y="276" font-size="16" font-weight="700" fill="#185fa5">Asymmetric — a key pair (public + private)</text>
  <g font-size="12.5" fill="#042c53">
    <rect x="48" y="304" width="120" height="40" rx="7" fill="#d7e8fa" stroke="#378add"/>
    <text x="108" y="329" text-anchor="middle">Plaintext</text>
    <line x1="172" y1="324" x2="222" y2="324" stroke="#5a6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="226" y="304" width="200" height="40" rx="7" fill="#e6f0fb" stroke="#378add"/>
    <text x="326" y="329" text-anchor="middle">Encrypt with PUBLIC key</text>
    <line x1="430" y1="324" x2="480" y2="324" stroke="#5a6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="484" y="304" width="120" height="40" rx="7" fill="#d7e8fa" stroke="#378add"/>
    <text x="544" y="329" text-anchor="middle">Ciphertext</text>
    <line x1="608" y1="324" x2="658" y2="324" stroke="#5a6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="662" y="304" width="190" height="40" rx="7" fill="#e6f0fb" stroke="#378add"/>
    <text x="757" y="329" text-anchor="middle">Decrypt with PRIVATE key</text>
  </g>
  <text x="48" y="378" font-size="12.5" fill="#233b3a">Public key can be shared freely; private key kept secret · slower</text>
  <text x="48" y="400" font-size="12.5" fill="#0f6e56">No key-distribution problem · also enables digital signatures</text>
</svg>
