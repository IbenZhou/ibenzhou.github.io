<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="820" height="340" fill="#ffffff"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f3d3e">JK flip-flop</text>
  <text x="410" y="56" text-anchor="middle" font-size="14" fill="#5a6b6b">An SR flip-flop with feedback — the J=K=1 problem is solved by toggling</text>

  <!-- block diagram -->
  <rect x="230" y="96" width="300" height="160" rx="12" fill="#eef7f5" stroke="#1d9e75" stroke-width="2"/>
  <text x="380" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#0f6e56">JK flip-flop</text>
  <text x="380" y="150" text-anchor="middle" font-size="12" fill="#0f6e56">clocked, bistable</text>

  <!-- inputs -->
  <g font-size="14" font-weight="700" fill="#233b3a">
    <text x="120" y="140">J</text>
    <text x="120" y="190">K</text>
    <text x="120" y="240">CLK</text>
  </g>
  <g stroke="#5a6b6b" stroke-width="1.6">
    <line x1="140" y1="136" x2="228" y2="136"/>
    <line x1="140" y1="186" x2="228" y2="186"/>
    <line x1="140" y1="236" x2="228" y2="236"/>
  </g>
  <!-- clock triangle -->
  <path d="M228 228 L240 236 L228 244 Z" fill="#d9a441" stroke="#d9a441"/>

  <!-- outputs -->
  <g stroke="#1d9e75" stroke-width="1.6">
    <line x1="530" y1="136" x2="640" y2="136"/>
    <line x1="530" y1="186" x2="640" y2="186"/>
  </g>
  <text x="650" y="141" font-size="15" font-weight="700" fill="#0f6e56">Q</text>
  <text x="650" y="191" font-size="15" font-weight="700" fill="#0f6e56">Q̄</text>

  <!-- truth summary -->
  <rect x="60" y="278" width="700" height="48" rx="9" fill="#fbf0d8" stroke="#d9a441" stroke-width="1"/>
  <text x="80" y="300" font-size="12.5" fill="#233b3a">J=0 K=0 → hold · J=0 K=1 → reset (Q=0) · J=1 K=0 → set (Q=1) · J=1 K=1 → toggle</text>
  <text x="80" y="318" font-size="12.5" fill="#854f0b">Feedback from Q and Q̄ makes the J=K=1 case toggle instead of being invalid (unlike SR)</text>
</svg>
