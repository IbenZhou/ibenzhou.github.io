<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#5a6b6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f3d3e">Process state transitions</text>
  <text x="450" y="56" text-anchor="middle" font-size="14" fill="#5a6b6b">A process moves between three states during its lifetime</text>

  <!-- running -->
  <rect x="370" y="90" width="160" height="60" rx="10" fill="#eef7f5" stroke="#1d9e75" stroke-width="2"/>
  <text x="450" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#0f6e56">RUNNING</text>
  <!-- ready -->
  <rect x="100" y="230" width="160" height="60" rx="10" fill="#e6f0fb" stroke="#378add" stroke-width="2"/>
  <text x="180" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#185fa5">READY</text>
  <!-- blocked -->
  <rect x="640" y="230" width="160" height="60" rx="10" fill="#fbf0d8" stroke="#d9a441" stroke-width="2"/>
  <text x="720" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#854f0b">BLOCKED</text>

  <!-- running -> ready -->
  <line x1="410" y1="150" x2="205" y2="228" stroke="#5a6b6b" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="228" y="150" width="180" height="38" rx="6" fill="#ffffff"/>
  <text x="318" y="166" text-anchor="middle" font-size="11.5" fill="#233b3a">time slice expires /</text>
  <text x="318" y="181" text-anchor="middle" font-size="11.5" fill="#233b3a">pre-empted by higher priority</text>

  <!-- ready -> running -->
  <line x1="215" y1="228" x2="420" y2="152" stroke="#5a6b6b" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="240" y="188" width="160" height="30" rx="6" fill="#ffffff"/>
  <text x="320" y="208" text-anchor="middle" font-size="11.5" fill="#185fa5">scheduled by OS</text>

  <!-- running -> blocked -->
  <line x1="530" y1="150" x2="700" y2="228" stroke="#5a6b6b" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="546" y="150" width="160" height="38" rx="6" fill="#ffffff"/>
  <text x="626" y="166" text-anchor="middle" font-size="11.5" fill="#233b3a">waiting for I/O /</text>
  <text x="626" y="181" text-anchor="middle" font-size="11.5" fill="#233b3a">an event</text>

  <!-- blocked -> ready -->
  <line x1="660" y1="250" x2="268" y2="250" stroke="#5a6b6b" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="392" y="256" width="160" height="28" rx="6" fill="#ffffff"/>
  <text x="472" y="274" text-anchor="middle" font-size="11.5" fill="#854f0b">event occurs / I/O complete</text>

  <text x="450" y="330" text-anchor="middle" font-size="12.5" fill="#5a6b6b">Only the scheduler moves a process from READY to RUNNING</text>
</svg>
