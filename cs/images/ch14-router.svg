<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" width="1000" height="790" style="max-width:100%;height:auto" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2C3E6B"/>
    </marker>
  </defs>

  <rect width="1000" height="790" fill="#F8F4ED"/>

  <!-- header in -->
  <rect x="20" y="20" width="960" height="160" rx="8" fill="#FFFFFF" stroke="#2C3E6B" stroke-width="1.6"/>
  <text x="42" y="48" font-size="15" font-weight="700" fill="#2C3E6B" letter-spacing="0.5">PACKET HEADER IN</text>

  <g font-size="12" fill="#5A6472">
    <text x="42" y="82">Destination IP</text>
    <text x="372" y="82">Source IP</text>
    <text x="702" y="82">Hop count</text>
    <text x="42" y="134">Sequence no.</text>
    <text x="372" y="134">Checksum</text>
    <text x="702" y="134">MAC of last hop</text>
  </g>
  <g font-size="15" font-weight="600" fill="#2C3E6B">
    <text x="42" y="106">192.168.4.17</text>
    <text x="372" y="106">10.0.2.9</text>
    <text x="702" y="106">5</text>
    <text x="42" y="158">2</text>
    <text x="372" y="158">0x4A1C</text>
    <text x="702" y="158">02:11:9A:..:3F</text>
  </g>

  <line x1="500" y1="180" x2="500" y2="212" stroke="#2C3E6B" stroke-width="2.5" marker-end="url(#a3)"/>

  <!-- router + routing table -->
  <rect x="20" y="216" width="960" height="200" rx="8" fill="#E8ECF5" stroke="#2C3E6B" stroke-width="1.8"/>
  <text x="42" y="244" font-size="15" font-weight="700" fill="#2C3E6B" letter-spacing="1">ROUTER</text>
  <text x="958" y="244" font-size="12" fill="#5A6472" text-anchor="end">consults its routing table</text>

  <rect x="42" y="254" width="916" height="128" rx="4" fill="#FFFFFF" stroke="#2C3E6B" stroke-width="1.2"/>
  <rect x="42" y="254" width="916" height="28" rx="4" fill="#2C3E6B"/>
  <g font-size="12" fill="#F8F4ED" font-weight="700">
    <text x="52" y="273">Destination network</text>
    <text x="300" y="273">Next hop MAC</text>
    <text x="650" y="273">Metric</text>
    <text x="730" y="273">Interface</text>
  </g>
  <rect x="42" y="282" width="916" height="25" fill="#F9EFEC"/>
  <g font-size="13" fill="#2C3E6B">
    <text x="52" y="300">192.168.4.0/24</text>
    <text x="300" y="300">4C:1D:6F:2A:88:01</text>
    <text x="650" y="300">1</text>
    <text x="730" y="300">eth0</text>

    <text x="52" y="328">10.0.2.0/24</text>
    <text x="300" y="328">4C:1D:6F:2A:88:0C</text>
    <text x="650" y="328">2</text>
    <text x="730" y="328">eth1</text>

    <text x="52" y="354">172.16.0.0/16</text>
    <text x="300" y="354">4C:1D:6F:2A:88:1B</text>
    <text x="650" y="354">3</text>
    <text x="730" y="354">eth2</text>

    <text x="52" y="378">0.0.0.0/0 (default)</text>
    <text x="300" y="378">4C:1D:6F:2A:88:2E</text>
    <text x="650" y="378">4</text>
    <text x="730" y="378">eth3</text>
  </g>
  <line x1="42" y1="307" x2="958" y2="307" stroke="#B5443C" stroke-width="1.3"/>
  <text x="42" y="408" font-size="12.5" fill="#B5443C">192.168.4.17 matches row 1 &#8594; best route found (lowest metric)</text>

  <line x1="500" y1="416" x2="500" y2="448" stroke="#2C3E6B" stroke-width="2.5" marker-end="url(#a3)"/>

  <!-- header out -->
  <rect x="20" y="452" width="960" height="180" rx="8" fill="#FFFFFF" stroke="#2C3E6B" stroke-width="1.6"/>
  <text x="42" y="480" font-size="15" font-weight="700" fill="#2C3E6B" letter-spacing="0.5">PACKET HEADER OUT</text>

  <g font-size="12" fill="#5A6472">
    <text x="42" y="514">Destination IP</text>
    <text x="372" y="514">Source IP</text>
    <text x="702" y="514">Hop count</text>
    <text x="42" y="566">Sequence no.</text>
    <text x="372" y="566">Checksum</text>
    <text x="702" y="566">MAC of next hop</text>
  </g>
  <g font-size="15" font-weight="600">
    <text x="42" y="538" fill="#2C3E6B">192.168.4.17</text>
    <text x="372" y="538" fill="#2C3E6B">10.0.2.9</text>
    <text x="702" y="538" fill="#B5443C">4 &#8592; decremented</text>
    <text x="42" y="590" fill="#2C3E6B">2</text>
    <text x="372" y="590" fill="#2C3E6B">0x4A1C</text>
    <text x="702" y="590" fill="#B5443C">4C:1D:6F:2A:88:01</text>
  </g>
  <text x="42" y="618" font-size="12.5" fill="#5A6472">IP addresses stay the same end to end &#8212; only the MAC address changes at each hop</text>

  <!-- note -->
  <rect x="20" y="652" width="960" height="118" rx="8" fill="#FFFFFF" stroke="#B5443C" stroke-width="1.4"/>
  <text x="42" y="684" font-size="14" font-weight="700" fill="#B5443C">The router discards the packet when</text>
  <text x="42" y="714" font-size="13.5" fill="#5A6472">&#8226; no route in the table matches the destination address</text>
  <text x="42" y="740" font-size="13.5" fill="#5A6472">&#8226; the hop count has already reached 0 &#8212; this stops lost packets bouncing forever</text>
</svg>
