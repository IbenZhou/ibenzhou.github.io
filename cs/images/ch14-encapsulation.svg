<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" style="max-width:100%;height:auto" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1000" height="700" fill="#F8F4ED"/>

  <!-- column headers -->
  <text x="20" y="52" font-size="15" font-weight="700" fill="#2C3E6B" letter-spacing="1">LAYER</text>
  <text x="160" y="52" font-size="15" font-weight="700" fill="#2C3E6B" letter-spacing="1">SENDING HOST &#183; DATA GROWS</text>
  <text x="580" y="52" font-size="15" font-weight="700" fill="#2C3E6B" letter-spacing="1">RECEIVING HOST</text>
  <text x="160" y="72" font-size="13" fill="#5A6472">layer 4 &#8594; layer 1</text>
  <text x="580" y="72" font-size="13" fill="#5A6472">layer 1 &#8594; layer 4 &#183; headers stripped</text>

  <!-- row 1: application -->
  <rect x="20" y="92" width="130" height="62" rx="6" fill="#E8ECF5" stroke="#2C3E6B" stroke-width="1.6"/>
  <text x="85" y="120" font-size="15" font-weight="700" fill="#2C3E6B" text-anchor="middle">Application</text>
  <text x="85" y="140" font-size="13" fill="#5A6472" text-anchor="middle">layer 4</text>

  <rect x="160" y="92" width="400" height="62" rx="5" fill="#E8ECF5" stroke="#2C3E6B" stroke-width="1.4"/>
  <text x="360" y="130" font-size="17" font-weight="600" fill="#2C3E6B" text-anchor="middle">message (data)</text>

  <rect x="580" y="92" width="400" height="62" rx="5" fill="#E8ECF5" stroke="#2C3E6B" stroke-width="1.4"/>
  <text x="780" y="130" font-size="17" font-weight="600" fill="#2C3E6B" text-anchor="middle">message (data)</text>

  <!-- row 2: transport -->
  <rect x="20" y="180" width="130" height="62" rx="6" fill="#E8ECF5" stroke="#2C3E6B" stroke-width="1.6"/>
  <text x="85" y="208" font-size="15" font-weight="700" fill="#2C3E6B" text-anchor="middle">Transport</text>
  <text x="85" y="228" font-size="13" fill="#5A6472" text-anchor="middle">layer 3</text>

  <rect x="160" y="180" width="115" height="62" rx="5" fill="#F6E4E1" stroke="#B5443C" stroke-width="1.4"/>
  <rect x="275" y="180" width="285" height="62" rx="5" fill="#E8ECF5" stroke="#2C3E6B" stroke-width="1.4"/>
  <text x="217" y="217" font-size="14" font-weight="700" fill="#B5443C" text-anchor="middle">TCP hdr</text>
  <text x="417" y="217" font-size="17" font-weight="600" fill="#2C3E6B" text-anchor="middle">data</text>

  <rect x="580" y="180" width="115" height="62" rx="5" fill="#F6E4E1" stroke="#B5443C" stroke-width="1.4"/>
  <rect x="695" y="180" width="285" height="62" rx="5" fill="#E8ECF5" stroke="#2C3E6B" stroke-width="1.4"/>
  <text x="637" y="217" font-size="14" font-weight="700" fill="#B5443C" text-anchor="middle">TCP hdr</text>
  <text x="837" y="217" font-size="17" font-weight="600" fill="#2C3E6B" text-anchor="middle">data</text>

  <!-- row 3: internet -->
  <rect x="20" y="268" width="130" height="62" rx="6" fill="#E8ECF5" stroke="#2C3E6B" stroke-width="1.6"/>
  <text x="85" y="296" font-size="15" font-weight="700" fill="#2C3E6B" text-anchor="middle">Internet</text>
  <text x="85" y="316" font-size="13" fill="#5A6472" text-anchor="middle">layer 2</text>

  <rect x="160" y="268" width="105" height="62" rx="5" fill="#F6E4E1" stroke="#B5443C" stroke-width="1.4"/>
  <rect x="265" y="268" width="100" height="62" rx="5" fill="#F6E4E1" stroke="#B5443C" stroke-width="1.4"/>
  <rect x="365" y="268" width="195" height="62" rx="5" fill="#E8ECF5" stroke="#2C3E6B" stroke-width="1.4"/>
  <text x="212" y="305" font-size="14" font-weight="700" fill="#B5443C" text-anchor="middle">IP hdr</text>
  <text x="315" y="305" font-size="14" font-weight="700" fill="#B5443C" text-anchor="middle">TCP hdr</text>
  <text x="462" y="305" font-size="17" font-weight="600" fill="#2C3E6B" text-anchor="middle">data</text>

  <rect x="580" y="268" width="105" height="62" rx="5" fill="#F6E4E1" stroke="#B5443C" stroke-width="1.4"/>
  <rect x="685" y="268" width="100" height="62" rx="5" fill="#F6E4E1" stroke="#B5443C" stroke-width="1.4"/>
  <rect x="785" y="268" width="195" height="62" rx="5" fill="#E8ECF5" stroke="#2C3E6B" stroke-width="1.4"/>
  <text x="632" y="305" font-size="14" font-weight="700" fill="#B5443C" text-anchor="middle">IP hdr</text>
  <text x="735" y="305" font-size="14" font-weight="700" fill="#B5443C" text-anchor="middle">TCP hdr</text>
  <text x="882" y="305" font-size="17" font-weight="600" fill="#2C3E6B" text-anchor="middle">data</text>

  <!-- row 4: link -->
  <rect x="20" y="356" width="130" height="62" rx="6" fill="#E8ECF5" stroke="#2C3E6B" stroke-width="1.6"/>
  <text x="85" y="384" font-size="15" font-weight="700" fill="#2C3E6B" text-anchor="middle">Link</text>
  <text x="85" y="404" font-size="13" fill="#5A6472" text-anchor="middle">layer 1</text>

  <rect x="160" y="356" width="100" height="62" rx="5" fill="#F6E4E1" stroke="#B5443C" stroke-width="1.4"/>
  <rect x="260" y="356" width="80" height="62" rx="5" fill="#F6E4E1" stroke="#B5443C" stroke-width="1.4"/>
  <rect x="340" y="356" width="72" height="62" rx="5" fill="#F6E4E1" stroke="#B5443C" stroke-width="1.4"/>
  <rect x="412" y="356" width="95" height="62" rx="5" fill="#E8ECF5" stroke="#2C3E6B" stroke-width="1.4"/>
  <rect x="507" y="356" width="53" height="62" rx="5" fill="#EAF1E5" stroke="#4F7A52" stroke-width="1.4"/>
  <text x="210" y="393" font-size="12" font-weight="700" fill="#B5443C" text-anchor="middle">Frame hdr</text>
  <text x="300" y="393" font-size="13" font-weight="700" fill="#B5443C" text-anchor="middle">IP hdr</text>
  <text x="376" y="393" font-size="12" font-weight="700" fill="#B5443C" text-anchor="middle">TCP</text>
  <text x="459" y="393" font-size="15" font-weight="600" fill="#2C3E6B" text-anchor="middle">data</text>
  <text x="533" y="393" font-size="12" font-weight="700" fill="#4F7A52" text-anchor="middle">FCS</text>

  <rect x="580" y="356" width="100" height="62" rx="5" fill="#F6E4E1" stroke="#B5443C" stroke-width="1.4"/>
  <rect x="680" y="356" width="80" height="62" rx="5" fill="#F6E4E1" stroke="#B5443C" stroke-width="1.4"/>
  <rect x="760" y="356" width="72" height="62" rx="5" fill="#F6E4E1" stroke="#B5443C" stroke-width="1.4"/>
  <rect x="832" y="356" width="95" height="62" rx="5" fill="#E8ECF5" stroke="#2C3E6B" stroke-width="1.4"/>
  <rect x="927" y="356" width="53" height="62" rx="5" fill="#EAF1E5" stroke="#4F7A52" stroke-width="1.4"/>
  <text x="630" y="393" font-size="12" font-weight="700" fill="#B5443C" text-anchor="middle">Frame hdr</text>
  <text x="720" y="393" font-size="13" font-weight="700" fill="#B5443C" text-anchor="middle">IP hdr</text>
  <text x="796" y="393" font-size="12" font-weight="700" fill="#B5443C" text-anchor="middle">TCP</text>
  <text x="879" y="393" font-size="15" font-weight="600" fill="#2C3E6B" text-anchor="middle">data</text>
  <text x="953" y="393" font-size="12" font-weight="700" fill="#4F7A52" text-anchor="middle">FCS</text>

  <!-- what each layer adds -->
  <g font-size="12.5" fill="#5A6472">
    <text x="160" y="172">&#8595; builds the message</text>
    <text x="160" y="260">&#8595; adds a TCP header &#8594; <tspan font-weight="700" fill="#2C3E6B">segment</tspan></text>
    <text x="160" y="348">&#8595; adds IP addresses &#8594; <tspan font-weight="700" fill="#2C3E6B">datagram (packet)</tspan></text>
    <text x="160" y="436">&#8595; adds frame header &amp; FCS &#8594; <tspan font-weight="700" fill="#2C3E6B">frame</tspan></text>
    <text x="580" y="172">&#8593; TCP header removed &#8212; data delivered to the application</text>
    <text x="580" y="260">&#8593; IP header checked, then removed</text>
    <text x="580" y="348">&#8593; frame header &amp; FCS checked, then removed</text>
    <text x="580" y="436">frame arrives from the network</text>
  </g>

  <!-- transmission bar -->
  <rect x="20" y="452" width="960" height="38" rx="6" fill="#2C3E6B"/>
  <text x="500" y="477" font-size="15" font-weight="600" fill="#F8F4ED" text-anchor="middle">sent as an electrical, optical or radio signal</text>

  <!-- note -->
  <rect x="20" y="510" width="960" height="158" rx="8" fill="#FFFFFF" stroke="#2C3E6B" stroke-width="1.2"/>
  <text x="44" y="546" font-size="17" font-weight="700" fill="#2C3E6B">Same data, four different names</text>
  <text x="44" y="576" font-size="14" fill="#5A6472">each layer wraps the data in its own header, so the payload is renamed at every step:</text>
  <text x="44" y="612" font-size="16" font-weight="600" fill="#B5443C">message &#8594; segment &#8594; datagram (packet) &#8594; frame</text>
  <text x="44" y="642" font-size="13" fill="#5A6472">the receiving host reverses the process, checking and removing one header per layer</text>
</svg>
