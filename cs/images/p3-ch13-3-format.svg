<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="300" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f3d3e">Layout of a binary floating-point word</text>
  <text x="450" y="56" text-anchor="middle" font-size="14" fill="#5a6b6b">Example: 10-bit mantissa + 6-bit exponent; both stored in two's complement</text>

  <g font-family="Consolas, Menlo, monospace" font-size="14" fill="#0f3d3e">
    <rect x="40" y="96" width="42" height="48" rx="6" fill="#faece7" stroke="#d85a30" stroke-width="1.2"/>
    <text x="61" y="126" text-anchor="middle" font-weight="700">1</text>
    <rect x="86" y="96" width="42" height="48" rx="6" fill="#eef7f5" stroke="#1d9e75" stroke-width="1.2"/>
    <text x="107" y="126" text-anchor="middle">0</text>
    <rect x="132" y="96" width="42" height="48" rx="6" fill="#eef7f5" stroke="#1d9e75" stroke-width="1.2"/>
    <text x="153" y="126" text-anchor="middle">0</text>
    <rect x="178" y="96" width="42" height="48" rx="6" fill="#eef7f5" stroke="#1d9e75" stroke-width="1.2"/>
    <text x="199" y="126" text-anchor="middle">0</text>
    <rect x="224" y="96" width="42" height="48" rx="6" fill="#eef7f5" stroke="#1d9e75" stroke-width="1.2"/>
    <text x="245" y="126" text-anchor="middle">1</text>
    <rect x="270" y="96" width="42" height="48" rx="6" fill="#eef7f5" stroke="#1d9e75" stroke-width="1.2"/>
    <text x="291" y="126" text-anchor="middle">1</text>
    <rect x="316" y="96" width="42" height="48" rx="6" fill="#eef7f5" stroke="#1d9e75" stroke-width="1.2"/>
    <text x="337" y="126" text-anchor="middle">0</text>
    <rect x="362" y="96" width="42" height="48" rx="6" fill="#eef7f5" stroke="#1d9e75" stroke-width="1.2"/>
    <text x="383" y="126" text-anchor="middle">0</text>
    <rect x="408" y="96" width="42" height="48" rx="6" fill="#eef7f5" stroke="#1d9e75" stroke-width="1.2"/>
    <text x="429" y="126" text-anchor="middle">0</text>
    <rect x="454" y="96" width="42" height="48" rx="6" fill="#eef7f5" stroke="#1d9e75" stroke-width="1.2"/>
    <text x="475" y="126" text-anchor="middle">0</text>
  </g>
  <!-- 6-bit exponent -->
  <g font-family="Consolas, Menlo, monospace" font-size="14" fill="#042c53">
    <rect x="528" y="96" width="42" height="48" rx="6" fill="#eef3fb" stroke="#378add" stroke-width="1.2"/>
    <text x="549" y="126" text-anchor="middle">0</text>
    <rect x="574" y="96" width="42" height="48" rx="6" fill="#eef3fb" stroke="#378add" stroke-width="1.2"/>
    <text x="595" y="126" text-anchor="middle">0</text>
    <rect x="620" y="96" width="42" height="48" rx="6" fill="#eef3fb" stroke="#378add" stroke-width="1.2"/>
    <text x="641" y="126" text-anchor="middle">0</text>
    <rect x="666" y="96" width="42" height="48" rx="6" fill="#eef3fb" stroke="#378add" stroke-width="1.2"/>
    <text x="687" y="126" text-anchor="middle">0</text>
    <rect x="712" y="96" width="42" height="48" rx="6" fill="#eef3fb" stroke="#378add" stroke-width="1.2"/>
    <text x="733" y="126" text-anchor="middle">1</text>
    <rect x="758" y="96" width="42" height="48" rx="6" fill="#eef3fb" stroke="#378add" stroke-width="1.2"/>
    <text x="779" y="126" text-anchor="middle">1</text>
  </g>

  <line x1="61" y1="156" x2="61" y2="178" stroke="#d85a30" stroke-width="1"/>
  <text x="61" y="196" text-anchor="middle" font-size="12.5" fill="#993c1d">sign bit</text>
  <text x="61" y="212" text-anchor="middle" font-size="11.5" fill="#993c1d">1 = negative</text>

  <line x1="270" y1="156" x2="270" y2="178" stroke="#1d9e75" stroke-width="1"/>
  <text x="270" y="196" text-anchor="middle" font-size="12.5" fill="#0f6e56">mantissa (10 bits)</text>
  <text x="270" y="212" text-anchor="middle" font-size="11.5" fill="#0f6e56">two's complement</text>

  <line x1="653" y1="156" x2="653" y2="178" stroke="#378add" stroke-width="1"/>
  <text x="653" y="196" text-anchor="middle" font-size="12.5" fill="#185fa5">exponent (6 bits)</text>
  <text x="653" y="212" text-anchor="middle" font-size="11.5" fill="#185fa5">two's complement</text>

  <text x="450" y="256" text-anchor="middle" font-size="13" fill="#233b3a">Value = mantissa (as a binary fraction) × 2 exponent</text>
  <text x="450" y="280" text-anchor="middle" font-size="12.5" fill="#993c1d">Both mantissa AND exponent use two's complement in CIE questions</text>
</svg>
