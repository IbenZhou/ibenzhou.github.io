<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#5a6b6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f3d3e">Creating and verifying a digital signature</text>
  <text x="450" y="56" text-anchor="middle" font-size="14" fill="#5a6b6b">Hashing + asymmetric encryption prove integrity and origin</text>

  <!-- sender side -->
  <rect x="24" y="82" width="852" height="120" rx="12" fill="#eef7f5" stroke="#1d9e75" stroke-width="1.5"/>
  <text x="44" y="108" font-size="14" font-weight="700" fill="#0f6e56">Sender — create the signature</text>
  <g font-size="12" fill="#0f3d3e">
    <rect x="44" y="126" width="110" height="46" rx="7" fill="#d5efe6" stroke="#1d9e75"/>
    <text x="99" y="153" text-anchor="middle">Message</text>
    <line x1="158" y1="149" x2="208" y2="149" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <rect x="212" y="126" width="110" height="46" rx="7" fill="#e3f2ed" stroke="#1d9e75"/>
    <text x="267" y="146" text-anchor="middle" font-size="11.5" fill="#0f6e56">Hash function</text>
    <text x="267" y="162" text-anchor="middle" font-size="11.5" fill="#0f6e56">→ digest</text>
    <line x1="326" y1="149" x2="376" y2="149" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <rect x="380" y="126" width="180" height="46" rx="7" fill="#e3f2ed" stroke="#1d9e75"/>
    <text x="470" y="146" text-anchor="middle" font-size="11.5" fill="#0f6e56">Encrypt digest with</text>
    <text x="470" y="162" text-anchor="middle" font-size="11.5" fill="#0f6e56">sender's PRIVATE key</text>
    <line x1="564" y1="149" x2="614" y2="149" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <rect x="618" y="126" width="230" height="46" rx="7" fill="#d5efe6" stroke="#1d9e75"/>
    <text x="733" y="146" text-anchor="middle" font-size="11.5" fill="#0f3d3e">Send: message + signature</text>
    <text x="733" y="162" text-anchor="middle" font-size="11.5" fill="#0f3d3e">(+ certificate)</text>
  </g>

  <!-- receiver side -->
  <rect x="24" y="220" width="852" height="140" rx="12" fill="#eef3fb" stroke="#378add" stroke-width="1.5"/>
  <text x="44" y="246" font-size="14" font-weight="700" fill="#185fa5">Receiver — verify the signature</text>
  <g font-size="12" fill="#042c53">
    <rect x="44" y="264" width="190" height="48" rx="7" fill="#d7e8fa" stroke="#378add"/>
    <text x="139" y="284" text-anchor="middle" font-size="11.5" fill="#185fa5">Decrypt signature with</text>
    <text x="139" y="300" text-anchor="middle" font-size="11.5" fill="#185fa5">sender's PUBLIC key → digest A</text>
    <line x1="238" y1="288" x2="288" y2="288" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <rect x="292" y="264" width="190" height="48" rx="7" fill="#d7e8fa" stroke="#378add"/>
    <text x="387" y="284" text-anchor="middle" font-size="11.5" fill="#185fa5">Hash the received</text>
    <text x="387" y="300" text-anchor="middle" font-size="11.5" fill="#185fa5">message → digest B</text>
    <line x1="486" y1="288" x2="536" y2="288" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <rect x="540" y="264" width="150" height="48" rx="7" fill="#e6f0fb" stroke="#378add"/>
    <text x="615" y="284" text-anchor="middle" font-size="11.5" fill="#185fa5">Compare</text>
    <text x="615" y="300" text-anchor="middle" font-size="11.5" fill="#185fa5">A vs B</text>
    <line x1="694" y1="288" x2="744" y2="288" stroke="#5a6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <rect x="748" y="264" width="100" height="48" rx="7" fill="#eef7f5" stroke="#1d9e75"/>
    <text x="798" y="284" text-anchor="middle" font-size="11.5" fill="#0f6e56">Match =</text>
    <text x="798" y="300" text-anchor="middle" font-size="11.5" fill="#0f6e56">genuine</text>
  </g>
  <text x="450" y="340" text-anchor="middle" font-size="12.5" fill="#993c1d">Same digest → message unchanged (integrity) and truly from the sender (authentication)</text>
</svg>
