<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="280" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f3d3e">Underflow, overflow and representable range</text>
  <text x="450" y="56" text-anchor="middle" font-size="14" fill="#5a6b6b">The exponent fixes the largest and smallest magnitudes</text>

  <!-- number line -->
  <line x1="70" y1="150" x2="830" y2="150" stroke="#5a6b6b" stroke-width="2"/>
  <polygon points="830,150 818,144 818,156" fill="#5a6b6b"/>

  <!-- zones -->
  <rect x="70" y="120" width="150" height="60" rx="8" fill="#eef3fb" stroke="#378add" stroke-width="1.2"/>
  <text x="145" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#185fa5">Underflow</text>
  <text x="145" y="166" text-anchor="middle" font-size="11.5" fill="#185fa5">too small → 0</text>

  <rect x="230" y="120" width="440" height="60" rx="8" fill="#eef7f5" stroke="#1d9e75" stroke-width="1.5"/>
  <text x="450" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#0f6e56">Representable range</text>
  <text x="450" y="168" text-anchor="middle" font-size="12" fill="#0f6e56">smallest non-zero value → largest positive value</text>

  <rect x="680" y="120" width="150" height="60" rx="8" fill="#faece7" stroke="#d85a30" stroke-width="1.2"/>
  <text x="755" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#993c1d">Overflow</text>
  <text x="755" y="166" text-anchor="middle" font-size="11.5" fill="#993c1d">too large</text>

  <!-- boundary markers -->
  <line x1="230" y1="112" x2="230" y2="192" stroke="#1d9e75" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="230" y="210" text-anchor="middle" font-size="11.5" fill="#0f6e56">most negative</text>
  <text x="230" y="224" text-anchor="middle" font-size="11.5" fill="#0f6e56">exponent</text>
  <line x1="670" y1="112" x2="670" y2="192" stroke="#1d9e75" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="670" y="210" text-anchor="middle" font-size="11.5" fill="#0f6e56">largest positive</text>
  <text x="670" y="224" text-anchor="middle" font-size="11.5" fill="#0f6e56">exponent</text>

  <text x="450" y="256" text-anchor="middle" font-size="12.5" fill="#993c1d">More mantissa bits → better precision · More exponent bits → wider range (fixed word length forces a trade-off)</text>
</svg>
